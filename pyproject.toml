[project]
name = "godi-ml"
version = "0.1.0a1"
description = "ML quality assurance via LLM sub-agents — catch what AutoML doesn't catch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Santiago Patino Serna", email = "santiagopatinoserna@godi.ai" },
]
keywords = ["machine-learning", "automl", "data-leakage", "model-evaluation", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-recording>=0.13",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
godi-ml = "godi_ml.cli:app"

[project.urls]
Homepage = "https://godi-ml.godi.ai"
Repository = "https://github.com/santiagopatinoserna/godi-ml"
Issues = "https://github.com/santiagopatinoserna/godi-ml/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godi_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Capital X (feature matrix) and y (target) are sklearn convention
"src/godi_ml/pipeline/*.py" = ["N803", "N806"]
"src/godi_ml/tasks/*.py" = ["N803", "N806"]
"tests/unit/*.py" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "sklearn.*", "matplotlib.*", "seaborn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
    "slow: marks slow tests",
]
